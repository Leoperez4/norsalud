{% extends "base.html" %}
{% block title %}{{ titulo }} | Norsalud{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ titulo }}</h1>
</div>
<div class="card">
    <p style="white-space: pre-line;">{{ mensaje }}</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
