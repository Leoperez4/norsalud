{% extends "base.html" %}
{% load static %}
{% block title %}Contraseña actualizada | Norsalud{% endblock %}
{% block content_class %}content-full{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="logo-circle"><img src="{% static 'img/logo-norsalud.png' %}" alt="Norsalud"></div>
        <h1>¡Contraseña actualizada!</h1>
        <p class="subtitle">Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a href="{% url 'panel:login' %}" class="btn btn-primary" style="display:block; text-align:center;">Iniciar sesión</a>
    </div>
</div>
{% endblock %}
